name: 闹钟没响 / 响错 / 关不掉
description: 该响没响、不该响响了、响了停不下来、排班算错、数据异常
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请尽量填全。我只有一台小米手机，拿不到你的设备，能不能定位基本取决于你写的信息。

        如果 App 崩过，请顺手从 **设置 → 更多设置 → 关于 → 导出崩溃日志** 把文件拖进来。

  - type: input
    id: device
    attributes:
      label: 手机型号与系统版本
      description: 设置 → 关于手机里能看到
      placeholder: 小米 13 / HyperOS 2.0.3（Android 15）
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 设置 → 更多设置 → 关于，最下面一行
      placeholder: v0.89.0 (209)
    validations:
      required: true

  - type: dropdown
    id: symptom
    attributes:
      label: 现象
      options:
        - 该响的时候没响
        - 不该响的时候响了
        - 响了但关不掉 / 停不下来
        - 提前提醒没出现
        - 睡前提醒没出现
        - 排班算错（该上班没响，或休息日响了）
        - 稍后再响 / 这次不响 不对
        - 数据丢失或恢复失败
        - 界面显示错误
        - 其它
    validations:
      required: true

  - type: textarea
    id: setup
    attributes:
      label: 这条闹钟是怎么设的
      description: 规则、时间、有没有标请假或加班；响铃时手机是什么状态
      placeholder: |
        例：大周工作日 07:00，前一天标了「加班」；响铃时手机在锁屏，没插耳机。
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 你期望发生什么，实际发生了什么
      placeholder: |
        期望：07:00 响铃。
        实际：06:58 有个提前提醒通知，到 07:00 没有任何声音，屏幕也没亮。
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: 出现过几次
      options:
        - 偶发，只遇到一两次
        - 稳定复现，每次都这样
        - 以前正常，更新后开始的
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 其它（可选）
      description: 截图、录屏可以直接拖进来。有没有改过电池优化、自启动、精确闹钟这几项权限，也请写一句
    validations:
      required: false
