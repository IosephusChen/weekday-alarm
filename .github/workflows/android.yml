name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # 2026-11-07：周末也跑一次。不是加一层保险，是踩到过：
    # UiLayoutTest.afterEditingAlarm_listAndHeroAgree 构造的是「仅上班日」闹钟，
    # 周六日会被渲染成「—」（今天休息），而断言写死了 07:00——同一份代码
    # UTC 周五绿、CST 周六红。runner 跑在 UTC，于是北京时间一整个周末 CI 都是红的，
    # 而「CI 绿」正是发版唯一的判据。平日绿不代表周末绿，这条 cron 让它周六早上
    # 就暴露，而不是等到发版那天。
    # UTC 周五 / 周六 22:00 = 北京周六 / 周日 06:00。
    - cron: '0 22 * * 5'
    - cron: '0 22 * * 6'
  workflow_dispatch:
    inputs:
      build_release:
        description: '同时出正式包（用 Secrets 里的 keystore，产物只作为 artifact，不建 Release）'
        type: boolean
        default: false

jobs:
  # 2026-11-06：版本一致性的「裁判」。这套检查原本只内联在 tools/release.sh 里，
  # 也就是只有「出包的那台机器」跑得到——Trae / 网页 agent 改完文档不会跑它，
  # 于是同一套规则在别处等于不存在。现在 CI 独立跑一份，不依赖 Gradle，
  # 十几秒出结果，坏了能在合并前就看见。
  version:
    name: Version consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check version and docs consistency
        run: python3 tools/check_version.py

  # 2026-11-07：test 与 release 合并成一个 job。
  # 原来两个 job 各自 checkout、装 JDK、装 Android SDK、冷启 Gradle，一次发版
  # 光这些启动就白等两分钟，而它们要做的事在同一个 workspace 里就能接上。
  # 代价是 job 变长、失败归因多绕一层，接受——出包步骤全部带 success() 闸门，
  # 测试红了不会走到出包。
  test:
    name: Unit tests + lint
    runs-on: ubuntu-24.04
    env:
      # 这次要不要出正式包。放 job 级是因为下面六个出包步骤都要判它。
      # push 分支写在前面：workflow_dispatch 没有 head_commit，靠短路绕开。
      IS_RELEASE: ${{ (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')) || (github.event_name == 'workflow_dispatch' && inputs.build_release) }}
    steps:
      # fetch-depth: 0：下面那步要拿 github.event.before 做 diff，浅克隆里没有这个对象，
      # 判断会永远失败、永远走全量。仓库只有 7MB，全克隆比再写一套 fetch 逻辑省心。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2026-11-07：只改文档时不必跑那 1082 条测试——代码没动，结果不可能变。
      # 但 version job 的文档一致性检查照跑，DocsConsistencyTest 也照跑（它读 docs/）。
      # 判定保守到近乎笨：只要有一个文件不在 docs/ 或根目录的 .md 里就走全量；
      # 拿不到 base commit（dispatch、force push、新建分支）也走全量。
      # 宁可白跑三分钟，不可漏跑一条。
      - name: Detect docs-only change
        id: scope
        if: ${{ github.event_name == 'push' }}
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "拿不到 base commit，按全量跑"
            exit 0
          fi
          # quotepath=false 必须给：git 默认把非 ASCII 文件名转义成 "docs/\346\201\242..."，
          # 带双引号且不是以 docs/ 开头，白名单必然匹配不上——那样只要改的是中文名文档
          # （恢复说明.md、项目状态.md、更新日志.md），判定就永远退化成全量，一次也省不到。
          CHANGED=$(git -c core.quotepath=false diff --name-only "$BASE" "${{ github.sha }}")
          echo "$CHANGED"
          if [ -z "$CHANGED" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$CHANGED" | grep -qvE '^(docs/|[^/]+\.md$)'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "有代码改动，跑全量"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "只有文档改动，只跑 DocsConsistencyTest"
          fi

      # wrapper 里的 distributionUrl 指向腾讯镜像（本地开发快），但 CI 机器在境外，
      # 从腾讯拉 130MB 又慢又可能超时。官方源会重定向到 GitHub 自己的 release 资产，
      # 对 Actions 来说是最快的一条路。
      - name: Point Gradle wrapper to official distribution
        run: sed -i 's|mirrors.cloud.tencent.com/gradle/|services.gradle.org/distributions/|' gradle/wrapper/gradle-wrapper.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 不能省掉 packages：这个 action 的默认值是 "tools platform-tools"，
      # 而 Google 在 cmdline-tools 16.0 里删掉了 tools 这个包，
      # 于是 sdkmanager --install tools 直接失败（2026-10 首次 CI 就是这么红的）。
      # 只留 platform-tools，平台的下载交给 Gradle 按 compileSdk 自动完成。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # 2026-11-07：缓存 ~/.gradle。之前每次冷启都要重下 Gradle distribution（130MB）
      # 与全部依赖，一轮 CI 有 60~90 秒花在这上面。key 按 wrapper 与构建脚本的哈希算，
      # 改依赖会 miss 一次，之后继续命中；distribution 那次 sed 后的 URL 是固定的，
      # 不会因为 sed 而每次都 miss。
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: ./gradlew testDebugUnitTest --console=plain --stacktrace

      # 文档提交只跑这一条：它读 docs/ 下的更新日志与使用说明，是唯一会被文档影响的测试。
      - name: Docs consistency only
        if: ${{ steps.scope.outputs.docs_only == 'true' }}
        run: ./gradlew testDebugUnitTest --tests "*DocsConsistencyTest*" --console=plain --stacktrace

      # 只扫 debug。release 变体与 debug 的源码、资源完全一样，差的只有 R8 与
      # BuildConfig 常量，lint 的 fatal 结论不会因此不同；而 release 那一遍要多建
      # 一套变体模型，白花 30~40 秒。真正会 fatal 的（混淆规则、资源引用）由
      # assembleRelease 自带的 lintVitalRelease 兜着。
      - name: Lint
        run: ./gradlew lintDebug --console=plain --stacktrace

      # 失败时也能看到报告：条数与 XML 结果一起上传，别让 CI 只给一个红叉
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      # ---- 以下只在发版时跑：`release:` 开头的提交推 main，或手动 dispatch 勾了选项 ----
      # 它的作用有两个：
      #   1. 证明 Secrets 里的 keystore 是活的——不然等到真发版那天才发现解不出来
      #   2. 不想动本机时，产一个带正式签名的包做验收
      # 它**不建 Release、不打 tag、不改 version.json**：发布权仍只在本机那一端。
      # 少一个能改线上状态的角色，就少一类「两端各发一次」的故障。
      #
      # 每个 step 都写了 success()：显式 if 会顶掉默认的 success()，不写的话
      # 测试红了照样出包，那道闸就形同虚设。

      # keystore.properties 里写的是相对路径 ../weekdayalarm-release.jks，
      # 所以 jks 必须落在仓库的上一级，和本地保持一致。
      - name: Restore keystore
        if: ${{ success() && env.IS_RELEASE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 为空，Secrets 没配好"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > ../weekdayalarm-release.jks
          ls -l ../weekdayalarm-release.jks

      - name: Write keystore.properties
        if: ${{ success() && env.IS_RELEASE == 'true' }}
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=../weekdayalarm-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Assemble release
        if: ${{ success() && env.IS_RELEASE == 'true' }}
        run: ./gradlew assembleRelease --console=plain

      # 没有 keystore 时 assembleRelease 照样 BUILD SUCCESSFUL，产物是 debug 签名的。
      # 那种包能装、却不能覆盖线上版本——所以这一步不能省。
      - name: Verify signature
        if: ${{ success() && env.IS_RELEASE == 'true' }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | head -4

      # mapping.txt 一起带上：release 开了 minify，没有它崩溃栈反混淆不出来。
      # 历次 Release 的 mapping 都是本地出包时手动补的，CI 这条路一直缺这一步。
      #
      # 2026-11-06：拆成两个 artifact。合在一起时每次下载都要拖 15MB 的 mapping，
      # 沙箱网络一抖就是五分钟；而看包验收只需要那 2.8MB 的 APK。发版时再单独取 mapping。
      - name: Upload APK
        if: ${{ success() && env.IS_RELEASE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload mapping
        if: ${{ success() && env.IS_RELEASE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
