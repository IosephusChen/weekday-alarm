name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_release:
        description: '同时出正式包（用 Secrets 里的 keystore，产物只作为 artifact，不建 Release）'
        type: boolean
        default: false

jobs:
  # 2026-11-06：版本一致性的「裁判」。这套检查原本只内联在 tools/release.sh 里，
  # 也就是只有「出包的那台机器」跑得到——Trae / 网页 agent 改完文档不会跑它，
  # 于是同一套规则在别处等于不存在。现在 CI 独立跑一份，不依赖 Gradle，
  # 十几秒出结果，坏了能在合并前就看见。
  version:
    name: Version consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check version and docs consistency
        run: python3 tools/check_version.py

  test:
    name: Unit tests + lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # wrapper 里的 distributionUrl 指向腾讯镜像（本地开发快），但 CI 机器在境外，
      # 从腾讯拉 130MB 又慢又可能超时。官方源会重定向到 GitHub 自己的 release 资产，
      # 对 Actions 来说是最快的一条路。
      - name: Point Gradle wrapper to official distribution
        run: sed -i 's|mirrors.cloud.tencent.com/gradle/|services.gradle.org/distributions/|' gradle/wrapper/gradle-wrapper.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 不能省掉 packages：这个 action 的默认值是 "tools platform-tools"，
      # 而 Google 在 cmdline-tools 16.0 里删掉了 tools 这个包，
      # 于是 sdkmanager --install tools 直接失败（2026-10 首次 CI 就是这么红的）。
      # 只留 platform-tools，平台的下载交给 Gradle 按 compileSdk 自动完成。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain --stacktrace

      - name: Lint
        # 只查 debug + release 两个变体。2026-11-06 加了 preview 变体（本地看手感用），
        # 聚合任务 lint 会把三个变体各扫一遍，白多几十秒；preview 的 fatal 问题由本地
        # assemblePreview 自带的 lintVitalPreview 兜着，CI 不必重复。
        run: ./gradlew lintDebug lintRelease --console=plain --stacktrace

      # 失败时也能看到报告：条数与 XML 结果一起上传，别让 CI 只给一个红叉
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # 手动触发才跑。两个作用：
  #   1. 证明 Secrets 里的 keystore 是活的——不然等到真发版那天才发现解不出来
  #   2. 不想动本机时，产一个带正式签名的包做验收
  # 它**不建 Release、不打 tag、不改 version.json**：发布权仍只在本机那一端。
  # 少一个能改线上状态的角色，就少一类「两端各发一次」的故障。
  #
  # 2026-11-06：除了手动 dispatch，`release:` 开头的提交推到 main 也直接出包。
  # 动机是省掉「push 跑一遍测试 → 再 dispatch 又跑一遍」的重复：串行轮换下
  # 一轮发版本来就有一次完整 CI，让它顺手把包出了。needs 仍然卡着，测试红了不出包。
  release:
    name: Assemble signed APK
    needs: [ version, test ]
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.build_release) ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Point Gradle wrapper to official distribution
        run: sed -i 's|mirrors.cloud.tencent.com/gradle/|services.gradle.org/distributions/|' gradle/wrapper/gradle-wrapper.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # keystore.properties 里写的是相对路径 ../weekdayalarm-release.jks，
      # 所以 jks 必须落在仓库的上一级，和本地保持一致。
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 为空，Secrets 没配好"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > ../weekdayalarm-release.jks
          ls -l ../weekdayalarm-release.jks

      - name: Write keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=../weekdayalarm-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Assemble release
        run: ./gradlew assembleRelease --console=plain

      # 没有 keystore 时 assembleRelease 照样 BUILD SUCCESSFUL，产物是 debug 签名的。
      # 那种包能装、却不能覆盖线上版本——所以这一步不能省。
      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | head -4

      # mapping.txt 一起带上：release 开了 minify，没有它崩溃栈反混淆不出来。
      # 历次 Release 的 mapping 都是本地出包时手动补的，CI 这条路一直缺这一步。
      #
      # 2026-11-06：拆成两个 artifact。合在一起时每次下载都要拖 15MB 的 mapping，
      # 沙箱网络一抖就是五分钟；而看包验收只需要那 2.8MB 的 APK。发版时再单独取 mapping。
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload mapping
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
