# 2026-11-09：改本文件要 token 带 `Workflows` 权限。fine-grained 勾 Repository permissions
# → Workflows: Read and write 就够，不必动用账号级 `repo` 权限的 classic（当天实测通过）。
# 缺这项时 git 与 REST 都拒，报 "refusing to allow a Personal Access Token to create or
# update workflow"——那不是配置坏了，是缺权限。

name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # 2026-11-07：周末也跑一次。不是加一层保险，是踩到过：
    # UiLayoutTest.afterEditingAlarm_listAndHeroAgree 构造的是「仅上班日」闹钟，
    # 周六日会被渲染成「—」（今天休息），而断言写死了 07:00——同一份代码
    # UTC 周五绿、CST 周六红。runner 跑在 UTC，于是北京时间一整个周末 CI 都是红的，
    # 而「CI 绿」正是发版唯一的判据。平日绿不代表周末绿，这条 cron 让它周六早上
    # 就暴露，而不是等到发版那天。
    # UTC 周五 / 周六 22:00 = 北京周六 / 周日 06:00。
    - cron: '0 22 * * 5'
    - cron: '0 22 * * 6'
  workflow_dispatch:

jobs:
  # 2026-11-06：版本一致性的「裁判」。这套检查原本只内联在 tools/release.sh 里，
  # 也就是只有「出包的那台机器」跑得到——Trae / 网页 agent 改完文档不会跑它，
  # 于是同一套规则在别处等于不存在。现在 CI 独立跑一份，不依赖 Gradle，
  # 十几秒出结果，坏了能在合并前就看见。
  version:
    name: Version consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check version and docs consistency
        run: python3 tools/check_version.py

      # 2026-11-09：文档里的 `文件:行号#锚点` 会随代码漂移。与 release.sh 共用同一份
      # 实现（tools/check_refs.py），本机能过 CI 就能过。只扫当前方案节，历史节不扫。
      - name: Check doc references
        run: python3 tools/check_refs.py

      # 2026-11-10：内置节假日数据有没有欠账。与 release.sh 共用一份实现。
      # 平时永远绿（「明年还没公布，催还早」）；每年 12 月起才红，红的意思就是
      # 「国务院安排了，内置层还没有」——v1.23.22 那笔就是这么漏的。
      - name: Check built-in holiday horizon
        run: python3 tools/check_holiday_horizon.py

  # 2026-11-07：test 与 release 合并成一个 job。
  # 原来两个 job 各自 checkout、装 JDK、装 Android SDK、冷启 Gradle，一次发版
  # 光这些启动就白等两分钟，而它们要做的事在同一个 workspace 里就能接上。
  #
  # 2026-11-09：出包那半截删了，这个 job 现在只剩守门（单测 + lint）。
  # 原先留着的理由是「沙箱里没有签名密钥，只能让 CI 签」——密钥搬去 NAS、
  # tools/fetch-keys.sh 一条命令就能拉下来之后，这个理由不成立了，
  # 而它的代价是一直在：release: 提交要等 200 秒才出包，GitHub 一抖就卡住。
  # 现在包在本地产（1~2 分钟、零联网），CI 只回答「这套代码自洽吗」。
  # 与之交换的是 CI 不再跑 lintVitalRelease——出包那步顺带做的 release 变体 lint。
  # 本地 tools/release.sh 的 assembleRelease 仍然会跑它，发版路径没丢这道。
  test:
    name: Unit tests + lint
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 0：下面那步要拿 github.event.before 做 diff，浅克隆里没有这个对象，
      # 判断会永远失败、永远走全量。仓库只有 7MB，全克隆比再写一套 fetch 逻辑省心。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2026-11-07：只改文档时不必跑那 1082 条测试——代码没动，结果不可能变。
      # 但 version job 的文档一致性检查照跑，DocsConsistencyTest 也照跑（它读 docs/）。
      # 判定保守到近乎笨：只要有一个文件不在 docs/ 或根目录的 .md 里就走全量；
      # 拿不到 base commit（dispatch、force push、新建分支）也走全量。
      # 宁可白跑三分钟，不可漏跑一条。
      - name: Detect docs-only change
        id: scope
        if: ${{ github.event_name == 'push' }}
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "拿不到 base commit，按全量跑"
            exit 0
          fi
          # quotepath=false 必须给：git 默认把非 ASCII 文件名转义成 "docs/\346\201\242..."，
          # 带双引号且不是以 docs/ 开头，白名单必然匹配不上——那样只要改的是中文名文档
          # （恢复说明.md、项目状态.md、更新日志.md），判定就永远退化成全量，一次也省不到。
          CHANGED=$(git -c core.quotepath=false diff --name-only "$BASE" "${{ github.sha }}")
          echo "$CHANGED"
          if [ -z "$CHANGED" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$CHANGED" | grep -qvE '^(docs/|[^/]+\.md$)'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "有代码改动，跑全量"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "只有文档改动，只跑 DocsConsistencyTest"
          fi

      # wrapper 里的 distributionUrl 指向腾讯镜像（本地开发快），但 CI 机器在境外，
      # 从腾讯拉 130MB 又慢又可能超时。官方源会重定向到 GitHub 自己的 release 资产，
      # 对 Actions 来说是最快的一条路。
      - name: Point Gradle wrapper to official distribution
        run: sed -i 's|mirrors.cloud.tencent.com/gradle/|services.gradle.org/distributions/|' gradle/wrapper/gradle-wrapper.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 不能省掉 packages：这个 action 的默认值是 "tools platform-tools"，
      # 而 Google 在 cmdline-tools 16.0 里删掉了 tools 这个包，
      # 于是 sdkmanager --install tools 直接失败（2026-10 首次 CI 就是这么红的）。
      # 只留 platform-tools，平台的下载交给 Gradle 按 compileSdk 自动完成。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # 2026-11-07：缓存 ~/.gradle。之前每次冷启都要重下 Gradle distribution（130MB）
      # 与全部依赖，一轮 CI 有 60~90 秒花在这上面。key 按 wrapper 与构建脚本的哈希算，
      # 改依赖会 miss 一次，之后继续命中；distribution 那次 sed 后的 URL 是固定的，
      # 不会因为 sed 而每次都 miss。
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: ./gradlew testDebugUnitTest --console=plain --stacktrace

      # 文档提交只跑这一条：它读 docs/ 下的更新日志与使用说明，是唯一会被文档影响的测试。
      - name: Docs consistency only
        if: ${{ steps.scope.outputs.docs_only == 'true' }}
        run: ./gradlew testDebugUnitTest --tests "*DocsConsistencyTest*" --console=plain --stacktrace

      # 只扫 debug。release 变体与 debug 的源码、资源完全一样，差的只有 R8 与
      # BuildConfig 常量，lint 的 fatal 结论不会因此不同；而 release 那一遍要多建
      # 一套变体模型，白花 30~40 秒。真正会 fatal 的（混淆规则、资源引用）由
      # 本地出包时 assembleRelease 自带的 lintVitalRelease 兜着——CI 从 2026-11-09
      # 起不出包了，这道改在 tools/release.sh 里跑。
      - name: Lint
        run: ./gradlew lintDebug --console=plain --stacktrace

      # 失败时也能看到报告：条数与 XML 结果一起上传，别让 CI 只给一个红叉
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

