plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.iosephuschen.weekdayalarm'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.iosephuschen.weekdayalarm"
        minSdk 26
        targetSdk 34
        versionCode 297
        versionName "1.23.12"
    }

    // 签名配置（v1.0.0 起用正式 keystore；v1.63.0 的「条件式」思路保留）：
    //   1. 仓库根有 keystore.properties → 用里面的正式签名（作者本机、发布构建）
    //   2. 没有这个文件 → 回落 ~/.android/debug.keystore（别人 clone 下来照样能构建）
    //   3. 两者都没有 → 不配签名，AGP 出未签名 release 包，debug 走默认签名
    // keystore.properties 已 gitignore，密码不进仓库；keystore 文件本身也不在仓库里。
    //
    // 为什么 1.0 换掉 debug 签名：调试证书的私钥是公开的（口令就是 android），
    // 任何人都能签一个同包名的包去覆盖安装；而且以后想换正式签名时，
    // 已装用户必须先卸载 —— 卸载等于设置全丢。这一步只能在发布前做。
    def propsFile = rootProject.file("keystore.properties")
    def ksProps = new Properties()
    if (propsFile.exists()) {
        propsFile.withInputStream { ksProps.load(it) }
    }
    def hasReleaseSigning = ksProps.getProperty("storeFile") != null
    def localDebugKeystore = file(System.getProperty("user.home") + "/.android/debug.keystore")
    def hasLocalKeystore = localDebugKeystore.exists()

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(ksProps.getProperty("storeFile"))
                storePassword ksProps.getProperty("storePassword")
                keyAlias ksProps.getProperty("keyAlias")
                keyPassword ksProps.getProperty("keyPassword")
                // v1+v2+v3 全开，保证各类安装器与低版本系统都能识别
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        } else if (hasLocalKeystore) {
            release {
                storeFile localDebugKeystore
                storePassword (project.findProperty("RELEASE_STORE_PASSWORD") ?: "android")
                keyAlias "androiddebugkey"
                keyPassword (project.findProperty("RELEASE_KEY_PASSWORD") ?: "android")
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }

        // preview 变体专用（2026-11-06）。这是一把**公开的**调试密钥：口令就是安卓
        // 调试密钥的标准值 android，别名 androiddebugkey，随仓库一起分发。
        //
        // 为什么要把一把密钥提交进仓库：沙箱每次开新会话都是干净环境，
        // AGP 会在 ~/.android/ 现生成一把新的 debug.keystore，签名就变了，
        // 手机端只能卸载重装。把密钥固定成这一份，跨会话签名恒定，
        // 覆盖安装永远成功、数据保留。
        //
        // 它与 docs/恢复说明.md 里那把发布密钥毫无关系：发布密钥的私钥只有作者持有，
        // 泄露等于全体用户必须卸载重装，绝不能进仓库（.gitignore 已挡住 *.jks）。
        preview {
            storeFile rootProject.file("tools/preview-debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // v1.68.0：显式开启 BuildConfig 生成（AGP 8 起默认关闭）。App.onCreate 要用
    // BuildConfig.DEBUG 区分「debug 构建不自动拉节假日数据」——单元测试跑的是
    // debug 变体，自动检查的后台线程会真的连网、整体替换远程数据层，
    // 把同一 JVM 里别的测试注入的数据冲掉（隔离跑全绿、全套跑随机红）。
    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    buildTypes {
        debug {
            if (hasReleaseSigning || hasLocalKeystore) signingConfig signingConfigs.release
        }
        release {
            // v1.66.0：开启 R8 + 资源压缩。主代码零反射、无动态加载类，AndroidX 的
            // consumer 规则由 AGP 自动带入，只需要下面 proguard-rules.pro 里几条兜底。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
            if (hasReleaseSigning || hasLocalKeystore) signingConfig signingConfigs.release
        }

        // preview（2026-11-06）：给「改完先看手感」用的包，不走 CI。
        //   - 包名加 .preview → 能和正式版并存，不用卸载正式版
        //   - 签 tools/preview-debug.keystore → 跨会话签名恒定，覆盖安装不丢数据
        //   - initWith release → R8 与资源压缩照旧，观感尽量贴近正式包
        // 它**不产 Release**：发布仍只走 release 变体，由 CI 在 test job 里出包。
        preview {
            initWith release
            applicationIdSuffix ".preview"
            versionNameSuffix "-preview"
            signingConfig signingConfigs.preview
        }
    }
}

// preview / release 变体都不跑单元测试（v1.23.10），本地验收入口只剩 debug，
// 与 CI 的 testDebugUnitTest 完全一致。
//
// preview：applicationIdSuffix 带了 .preview，Robolectric 里 Context.getPackageName()
// 是 io.github.…weekdayalarm.preview，清单合并出来的 receiver 仍属于
// io.github.…weekdayalarm —— WidgetProviderConfigTest 用包名过滤，一个都匹配不上，
// 报「应有五个小组件 receiver 注册，实际 []」。生产包没这个问题，本地却每次全量假红。
//
// release：与 debug 同一份源码，JVM 单测只差一个 BuildConfig.DEBUG，R8 根本不进单测路径。
// 跑第二遍除了把 1125 条变成 3 分钟，没有新增覆盖。
androidComponents {
    beforeVariants(selector().withBuildType("preview")) { variant ->
        variant.enableUnitTest = false
    }
    beforeVariants(selector().withBuildType("release")) { variant ->
        variant.enableUnitTest = false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // 单元测试（JVM）：org.json 用独立实现，因为 Android 内置的 org.json 在 JVM 测试里是抛异常的 stub
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    // Robolectric：在 JVM 上跑真实 Android framework，用于复现界面点击路径的崩溃
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
}

// v1.47.7：文档也算单测的输入。
// DocsConsistencyTest 会去读 docs/ 下的更新日志与使用说明，但 Gradle 默认只把
// 源码/资源当输入——改完文档再跑测试会被判「UP-TO-DATE」直接跳过，检查等于没做。
// 声明之后，任何文档改动都会让 testDebugUnitTest 重跑。
tasks.withType(Test).configureEach {
    inputs.dir(rootProject.file("docs"))
            .withPathSensitivity(org.gradle.api.tasks.PathSensitivity.RELATIVE)
            .optional()
    // 2026-11-07：不参与构建缓存。Test 默认是 cacheable 的，而 CI 的缓存里存着
    // 上一次同 commit 的「测试全绿」，重跑 job 时会直接恢复结果、一条测试都不跑。
    // 编译产物照旧走缓存（省的是那 30~40 秒），测试必须真跑。
    outputs.cacheIf { false }
    // 别加 -XX:TieredStopAtLevel=1 想省 JIT（2026-11-07 试过）：13 条测试挂在
    // "Out of space in CodeCache for adapters" 上，整轮从 77 秒涨到 122 秒。
    // Robolectric 的沙箱 classloader 要编的类比普通测试多得多，C1 的 CodeCache 装不下。
}
