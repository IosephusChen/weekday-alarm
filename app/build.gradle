plugins {
    id 'com.android.application'
}

android {
    namespace 'com.daxz.weekalarm'
    compileSdk 34

    defaultConfig {
        applicationId "com.daxz.weekalarm"
        minSdk 26
        targetSdk 34
        versionCode 137
        versionName "1.49.1"
    }

    signingConfigs {
        // 使用本机 debug keystore（别名 androiddebugkey / 密码 android），
        // 同时启用 v1+v2+v3 签名，保证各类安装器与低版本系统都能识别
        release {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // 单元测试（JVM）：org.json 用独立实现，因为 Android 内置的 org.json 在 JVM 测试里是抛异常的 stub
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    // Robolectric：在 JVM 上跑真实 Android framework，用于复现界面点击路径的崩溃
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
}

// v1.47.7：文档也算单测的输入。
// DocsConsistencyTest 会去读 docs/ 下的更新日志与使用说明，但 Gradle 默认只把
// 源码/资源当输入——改完文档再跑测试会被判「UP-TO-DATE」直接跳过，检查等于没做。
// 声明之后，任何文档改动都会让 testDebugUnitTest 重跑。
tasks.withType(Test).configureEach {
    inputs.dir(rootProject.file("docs"))
            .withPathSensitivity(org.gradle.api.tasks.PathSensitivity.RELATIVE)
            .optional()
}
