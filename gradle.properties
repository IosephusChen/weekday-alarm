org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true
# 2026-11-07：构建缓存。CI 每次都是干净 workspace，编译（javac + 资源合并）要重做
# 30~40 秒，而输入根本没变。开启后 setup-gradle 会把 ~/.gradle/caches 一起存
# Actions 缓存，同一份源码第二次构建直接 FROM-CACHE。
# Test 任务单独关掉了缓存（见 app/build.gradle），否则「重跑 job」会从缓存恢复
# 一个「测试通过」的结果而根本没跑测试。
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
