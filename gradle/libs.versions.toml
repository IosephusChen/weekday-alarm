# 依赖与插件版本的唯一声明处（2026-11-12；2026-11-14 工具链升级）。
# 以前 AGP 写在根 build.gradle、依赖写在 app/build.gradle，改版本要翻两个文件。

[versions]
# 2026-11-14：AGP 8.13.2。8.12+ 的 unit test 清单默认不含 App 自己的 receiver，
# 由 app/build.gradle 的 sourceSets.test.manifest 指回主清单解决；
# 那条修复失效时 BootReceiverTest 5 条会变红，升级 AGP 前先跑它。
agp = "8.13.2"
appcompat = "1.8.0"
material = "1.14.0"
junit = "4.13.2"
json = "20260814"
# 4.18 支持 SDK 36，但跑 @Config(sdk=36) 需要 JDK 21；当前测试仍钉 SDK 34 + JDK 17。
robolectric = "4.18"
androidxTestCore = "1.7.0"

[libraries]
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
